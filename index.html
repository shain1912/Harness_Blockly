<html lang="en">
<head>

       (Cormorant Garamond — the documented Copernicus substitute), mono (JetBrains Mono).
       Loaded from Google Fonts when online; degrades to system fonts offline (non-breaking). -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">

  <!-- Blockly — self-hosted (offline). Vendored from the `blockly` npm package into
       public/vendor/blockly by the desktop build; no CDN required. -->
  <script src="/vendor/blockly/blockly_compressed.js"></script>
  <script src="/vendor/blockly/blocks_compressed.js"></script>
  <script src="/vendor/blockly/python_compressed.js"></script>
  <script src="/vendor/blockly/msg/en.js"></script>
</head>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
