<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlockPy - Advanced Bidirectional Harness Playground</title>
  
  <!-- Modern Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for Premium Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Blockly Library from CDN -->
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/python_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/en.js"></script>
</head>
<body class="cyber-theme">

  <div id="root"></div>

  <!-- Hidden Custom Toolbox definition for Blockly -->
  <xml id="toolbox" style="display: none">

    <!-- ── I/O ─────────────────────────────────────────────── -->
    <category name="I/O" colour="#e67e22">
      <block type="text_print">
        <value name="TEXT">
          <shadow type="text"><field name="TEXT">Hello, World!</field></shadow>
        </value>
      </block>
      <block type="text_prompt_ext">
        <field name="TYPE">TEXT</field>
        <value name="TEXT">
          <shadow type="text"><field name="TEXT">Enter value:</field></shadow>
        </value>
      </block>
    </category>

    <!-- ── Variables ─────────────────────────────────────────── -->
    <category name="Variables" colour="#a55b80" custom="VARIABLE"></category>

    <!-- ── Modules &amp; Attributes ───────────────────────────── -->
    <category name="Modules" colour="#b55bf7">
      <block type="import_statement"></block>
      <block type="attribute_access"></block>
    </category>

    <!-- ── Logic ─────────────────────────────────────────────── -->
    <category name="Logic" colour="#5b80a5">
      <block type="controls_if"></block>
      <block type="controls_if">
        <mutation else="1"></mutation>
      </block>
      <block type="controls_if">
        <mutation elseif="1" else="1"></mutation>
      </block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_boolean"></block>
      <block type="logic_null"></block>
      <block type="logic_ternary"></block>
      <!-- [W3] identity (is / is not) and membership (in / not in) tests -->
      <block type="identity_test"></block>
      <block type="membership_test"></block>
    </category>

    <!-- ── Loops ─────────────────────────────────────────────── -->
    <category name="Loops" colour="#5ba55b">
      <block type="controls_repeat_ext">
        <value name="TIMES">
          <shadow type="math_number"><field name="NUM">10</field></shadow>
        </value>
      </block>
      <block type="controls_whileUntil">
        <field name="MODE">WHILE</field>
      </block>
      <block type="controls_for">
        <field name="VAR">i</field>
        <value name="FROM"><shadow type="math_number"><field name="NUM">0</field></shadow></value>
        <value name="TO"><shadow type="math_number"><field name="NUM">9</field></shadow></value>
        <value name="BY"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
      </block>
      <block type="controls_forEach">
        <field name="VAR">item</field>
      </block>
      <block type="controls_flow_statements">
        <field name="FLOW">BREAK</field>
      </block>
      <block type="controls_flow_statements">
        <field name="FLOW">CONTINUE</field>
      </block>
      <block type="controls_pass"></block>
    </category>

    <!-- ── Math ──────────────────────────────────────────────── -->
    <category name="Math" colour="#5b67a5">
      <block type="math_number"><field name="NUM">0</field></block>
      <block type="math_arithmetic"></block>
      <block type="math_single"></block>
      <block type="math_trig"></block>
      <block type="math_round"></block>
      <block type="math_modulo"></block>
      <!-- [W3] floor division, bitwise binary ops, and bitwise NOT -->
      <block type="math_int_divide"></block>
      <block type="bitwise_operation"></block>
      <block type="bitwise_not"></block>
      <block type="math_constrain">
        <value name="LOW"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
        <value name="HIGH"><shadow type="math_number"><field name="NUM">100</field></shadow></value>
      </block>
      <block type="math_random_int">
        <value name="FROM"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
        <value name="TO"><shadow type="math_number"><field name="NUM">100</field></shadow></value>
      </block>
      <block type="math_number_property"></block>
    </category>

    <!-- ── Text ──────────────────────────────────────────────── -->
    <category name="Text" colour="#5ba5a5">
      <block type="text"><field name="TEXT">abc</field></block>
      <block type="text_join"></block>
      <block type="text_append">
        <value name="TEXT">
          <shadow type="text"><field name="TEXT">abc</field></shadow>
        </value>
      </block>
      <block type="text_length">
        <value name="VALUE">
          <shadow type="text"><field name="TEXT">abc</field></shadow>
        </value>
      </block>
      <block type="text_isEmpty">
        <value name="VALUE">
          <shadow type="text"><field name="TEXT"></field></shadow>
        </value>
      </block>
      <block type="text_indexOf">
        <value name="VALUE">
          <shadow type="text"><field name="TEXT">abc</field></shadow>
        </value>
        <value name="FIND">
          <shadow type="text"><field name="TEXT">a</field></shadow>
        </value>
      </block>
      <block type="text_charAt">
        <value name="VALUE">
          <shadow type="text"><field name="TEXT">abc</field></shadow>
        </value>
      </block>
      <block type="text_getSubstring">
        <value name="STRING">
          <shadow type="text"><field name="TEXT">abc</field></shadow>
        </value>
      </block>
      <block type="text_changeCase"></block>
      <block type="text_trim"></block>
    </category>

    <!-- ── Lists ─────────────────────────────────────────────── -->
    <category name="Lists" colour="#745ba5">
      <block type="lists_create_with"><mutation items="0"></mutation></block>
      <block type="lists_create_with"><mutation items="3"></mutation></block>
      <block type="lists_repeat">
        <value name="NUM"><shadow type="math_number"><field name="NUM">5</field></shadow></value>
      </block>
      <block type="lists_length"></block>
      <block type="lists_isEmpty"></block>
      <block type="lists_indexOf"></block>
      <block type="lists_getIndex"></block>
      <block type="lists_setIndex"></block>
      <block type="lists_getSublist"></block>
      <block type="lists_sort"></block>
      <block type="lists_split">
        <value name="DELIM">
          <shadow type="text"><field name="TEXT">,</field></shadow>
        </value>
      </block>
      <block type="list_append_custom">
        <value name="VALUE">
          <shadow type="math_number"><field name="NUM">0</field></shadow>
        </value>
      </block>
      <block type="list_comprehension"></block>
    </category>

    <!-- ── Functions ─────────────────────────────────────────── -->
    <category name="Functions" colour="#9b59b6" custom="PROCEDURE"></category>

    <!-- ── Motion & Pen ──────────────────────────────────────── -->
    <category name="Motion &amp; Pen" colour="#2b82c9">
      <block type="sprite_move">
        <value name="STEPS">
          <shadow type="math_number"><field name="NUM">50</field></shadow>
        </value>
      </block>
      <block type="sprite_turn">
        <field name="DIRECTION">right</field>
        <value name="ANGLE">
          <shadow type="math_number"><field name="NUM">90</field></shadow>
        </value>
      </block>
      <block type="sprite_pen"><field name="PEN_STATE">down</field></block>
      <block type="sprite_color"><field name="COLOR">#a855f7</field></block>
      <block type="sprite_say">
        <value name="MESSAGE">
          <shadow type="text"><field name="TEXT">Hello!</field></shadow>
        </value>
      </block>
    </category>

    <!-- ── OpenCV ─────────────────────────────────────────────── -->
    <category name="OpenCV" colour="#c0392b">
      <block type="cv2_videocapture">
        <value name="DEVICE">
          <shadow type="math_number"><field name="NUM">0</field></shadow>
        </value>
      </block>
      <block type="cv2_read"></block>
      <block type="cv2_imshow">
        <value name="TITLE">
          <shadow type="text"><field name="TEXT">Live Feed</field></shadow>
        </value>
      </block>
      <block type="cv2_waitkey">
        <value name="DELAY">
          <shadow type="math_number"><field name="NUM">1</field></shadow>
        </value>
      </block>
      <block type="cv2_destroyall"></block>
      <block type="cv2_release"></block>
    </category>

    <!-- ── AI Library Blocks ──────────────────────────────────── -->
    <category name="AI Libraries" colour="#009688" id="abstract-lib-category" style="display: none;">
    </category>

  </xml>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
